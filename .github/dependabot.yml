# Synced from boycepoleonjr/conventions v1.3.1. Edit there, or add "dependabot" to "skip" in .conventions.json.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Checkout is held at v4.4.0 on purpose (see claude.yml, claude-code-review.yml).
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        update-types: ["major"]
