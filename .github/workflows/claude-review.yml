name: Claude PR review

# Automatic review when a PR is opened, updated, or marked ready.
# Drafts are skipped to avoid spending API usage on work in progress.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Mango Planner, a client-side Next.js + TypeScript
            tool that turns design preferences into prompts. Focus on:

            1. Correctness: prompt generation must stay deterministic, omit empty sections,
               dedupe instructions, and never invent goals, branding, fonts, or references.
            2. Conflict handling: unresolved conflicts must stay out of copy and export.
            3. Persistence: stored data is untrusted and must be sanitized, never crash the app.
            4. Accessibility: keyboard operation, labels, visible focus, no hover-only actions.
            5. Tests: changes to src/lib should come with vitest coverage.

            Report only real problems with a concrete failure scenario. Use inline comments
            for specific lines and one top-level summary comment. Skip style nits that
            prettier or eslint already enforce.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
